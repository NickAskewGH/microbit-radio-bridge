[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "microbit-radio-bridge"
version = "0.1.0"
description = "Capture, decode, and emulate supported 2.4 GHz remote-control protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[project.scripts]
microbit-radio = "microbit_radio.cli:main"
radio-bridge = "microbit_radio.cli:main"

[tool.setuptools.packages.find]
where = ["host"]
include = ["microbit_radio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["host"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["host", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
